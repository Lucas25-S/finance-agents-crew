services:
  backend-api:
    build: ./backend
    container_name: finance-backend  # ✅ Adicione nome
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:  # ✅ ADICIONE ISSO
      - finance-network

  frontend-web:
    build: ./frontend
    container_name: finance-frontend  # ✅ Adicione nome
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html
    depends_on:
      - backend-api
      - mysql
    networks:  # ✅ ADICIONE ISSO
      - finance-network

  mysql:
    image: mysql:8.0
    container_name: finance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:  # ✅ ADICIONE ISSO
      - finance-network

volumes:
  dbdata:

# ✅ ADICIONE ESTA SEÇÃO COMPLETA
networks:
  finance-network:
    driver: bridge